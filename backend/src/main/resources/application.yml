server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bisai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  ai:
    openai:
      # 全局默认：小米 MiMo（OpenAI 兼容接口），用于 Chat（同 aiwechat 项目的接法）
      base-url: ${AI_BASE_URL:https://api.xiaomimimo.com/v1}
      api-key: ${AI_API_KEY:YOUR_XIAOMIMIMO_API_KEY}
      chat:
        # base-url 已含 /v1，去掉默认的 /v1 前缀避免路径重复
        completions-path: /chat/completions
        options:
          model: ${AI_CHAT_MODEL:mimo-v2.5}
          max-tokens: 2048
          temperature: 0.3
      embedding:
        # Embedding 保留 ModelScope（小米 MiMo 端点不提供 embedding）
        base-url: https://api-inference.modelscope.cn
        api-key: ${AI_EMBEDDING_API_KEY:YOUR_MODELSCOPE_API_KEY}
        options:
          model: damo/nlp_corom_sentence-embedding_chinese-base

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.bisai.mapper: warn
    com.bisai.service: info
    com.bisai.controller: info
    "[org.apache.fontbox]": error
    "[org.apache.pdfbox.pdmodel.font.FileSystemFontProvider]": error
    "[org.apache.poi.hwpf.converter]": error

# 文件存储
file:
  upload-path: ./data/files/
  allowed-types: .doc,.docx,.pdf,.jpg,.jpeg,.png,.xls,.xlsx,.zip
  max-size: 209715200
  max-versions: 10

# JWT
jwt:
  secret: ${JWT_SECRET:bisai-smart-evaluation-system-jwt-secret-key-2024}
  expiration: 86400000

# AI 模型配置 (小米 MiMo)
ai:
  base-url: https://api.xiaomimimo.com/v1
  api-key: ${AI_API_KEY:YOUR_XIAOMIMIMO_API_KEY}
  model: mimo-v2.5
  fallback-model:
  embedding-model: damo/nlp_corom_sentence-embedding_chinese-base
  vision-model: mimo-v2.5
  max-tokens: 2048
  temperature: 0.3
  daily-token-limit: ${AI_DAILY_TOKEN_LIMIT:500000}
  daily-call-limit: ${AI_DAILY_CALL_LIMIT:2000}
  # 默认走 LLM-as-a-Judge 多轮采样评分（规则预评分 + 多轮 CoT + few-shot + 冗长修正 + 交叉模型）
  # 设为 true 则改走 Agentic（ReAct 工具调用）路径，但后者不使用 ScoreJudgeService
  use-agent-score: false
  rerank-model:
