server {
    listen 80;
    server_name _;              # 以后绑了域名就填域名
    server_tokens off;          # 隐藏 nginx 版本号
    client_max_body_size 200m;  # 允许大文件上传（后端限制200MB）

    # ===== 安全响应头 =====
    add_header X-Frame-Options "DENY" always;                          # 禁止被嵌入 iframe（防点击劫持）
    add_header X-Content-Type-Options "nosniff" always;                # 禁止浏览器嗅探文件类型
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== 屏蔽隐藏文件（.git/.env/.svn 等）=====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 前端静态文件
    root /opt/bisai/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # Vue 路由 history 模式回退
    }

    # 登录接口：每 IP 每分钟最多 6 次（防撞库/爆破，超出返回 503）
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        include /etc/nginx/snippets/bisai-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    # 其他后端接口：每 IP 每秒 20 次（AI 评分等慢接口已放宽超时）
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/bisai-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
}
